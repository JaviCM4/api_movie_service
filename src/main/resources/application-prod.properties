# ============================================================
# Server
# ============================================================
server.port=8083

# ============================================================
# DataSource - PostgreSQL (PRODUCCION)
# ============================================================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ============================================================
# JPA / Hibernate
# ============================================================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=false

# ============================================================
# Flyway
# ============================================================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false

# ============================================================
# Security / JWT (PRODUCCION)
# ============================================================
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${JWKS_URI}

# ============================================================
# Kafka (PRODUCCION)
# ============================================================
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS}

# ============================================================
# Microservicios (PRODUCCION)
# ============================================================
services.tickets.url=${TICKETS_SERVICE_URL}
services.users.url=${USERS_SERVICE_URL}

# ============================================================
# Logging (PRODUCCION)
# ============================================================
logging.level.com.example.movies=INFO
logging.level.org.springframework.security=INFO
