spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false

spring.flyway.enabled=false

spring.config.import=

# Variables del base que necesitan valor en tests
DB_URL=jdbc:h2:mem:testdb
DB_USERNAME=sa
DB_PASSWORD=


services.users.url=http://localhost:8081
services.tickets.url=http://localhost:8085
spring.kafka.bootstrap-servers=http://localhost:9092
#jwt.secret=dev-secret-local-temporal-minimo-32-caracteres
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://auth-service/.well-known/jwks.json